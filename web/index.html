<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100f0d" media="(prefers-color-scheme: dark)">
  <title>初听 · 你的初听时间线</title>
  <meta name="description" content="把每首歌第一次听见的时间，写成一条可以慢慢翻看的时间线。只保存在你电脑上的网易云音乐初听档案。">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="#top" aria-label="初听，回到开头">
        <span class="soundmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">初听</span>
      </a>
      <div class="bar-actions">
        <span id="accountLabel" class="account-label">未连接</span>
        <button type="button" class="button ghost" id="connectButton">连接网易云</button>
        <button type="button" class="button primary" id="syncButton">同步歌曲</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="heroTitle">
      <button type="button" class="hero-latest" id="heroLatest" hidden>
        <span class="record" aria-hidden="true"><span class="record-label" id="latestTime"></span></span>
        <span class="latest-kicker">最近一次初听</span>
        <span class="latest-title" id="latestTitle"></span>
        <span class="latest-meta" id="latestMeta"></span>
      </button>
      <p class="kicker" id="heroKicker">网易云音乐 · 初听档案</p>
      <h1 class="hero-title" id="heroTitle"><span>你的</span><em>初听</em></h1>
      <p class="hero-story" id="heroStory"></p>
      <p class="hero-sub" id="heroSub"></p>
      <div class="hero-actions">
        <button type="button" class="button primary large" id="heroAction" hidden></button>
        <a class="scroll-cue" href="#timelineSection" id="scrollCue" hidden><span>往下翻，从<span id="scrollCueText">最近的一首</span>开始</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg></a>
      </div>
      <div id="syncLine" class="sync-line" role="status" hidden>
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="syncMessage" class="sync-message"></span>
        <button type="button" id="pauseButton" class="text-button" hidden>暂停同步</button>
        <progress id="coverageProgress" max="1" value="0" aria-label="歌曲查询进度"></progress>
      </div>
    </section>

    <section class="timeline-section" id="timelineSection" aria-labelledby="timelineTitle">
      <div class="timeline-head">
        <div class="timeline-heading">
          <h2 id="timelineTitle">时间线</h2>
          <p id="timelineMeta" class="timeline-meta"></p>
        </div>
        <div class="timeline-tools">
          <label class="search">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg>
            <input id="songSearch" type="search" placeholder="搜索歌名或歌手" aria-label="搜索歌名或歌手" autocomplete="off" enterkeyhint="search">
          </label>
          <div class="segmented" role="group" aria-label="排列顺序">
            <button type="button" id="orderNewest" aria-pressed="true">最新在前</button>
            <button type="button" id="orderOldest" aria-pressed="false">从头讲起</button>
          </div>
        </div>
      </div>
      <div class="timeline-body">
        <nav id="scrubber" class="scrubber" aria-label="跳到月份"></nav>
        <div class="timeline-main">
          <div id="timeline" class="timeline" aria-live="polite"></div>
          <div id="sentinel" class="sentinel" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <footer class="closing">
      <p class="closing-line">这里只记录每首歌的<strong>第一次</strong>播放，<br class="mobile-break">不是每天完整的听歌记录。</p>
      <div class="closing-row">
        <p class="closing-note"><span class="ok-dot" aria-hidden="true"></span>所有数据只保存在这台电脑上 · 时间按北京时间显示</p>
        <div class="export-links"><a href="/api/export?format=json" id="exportJson">导出 JSON</a><a href="/api/export?format=csv" id="exportCsv">导出 CSV</a></div>
      </div>
    </footer>
  </main>

  <dialog id="collectDialog" aria-labelledby="collectTitle">
    <form id="collectForm">
      <button type="button" class="dialog-close icon-button" id="closeCollect" aria-label="关闭"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
      <p class="kicker">同步歌曲</p>
      <h2 id="collectTitle">把更多初听找回来</h2>
      <p class="dialog-copy">先从最近播放、听歌排行和喜欢的歌曲里找出歌曲，再逐首查询它们的初听时间。查过的歌会自动跳过。</p>
      <label class="form-field">这次查询多少首
        <select id="batchLimit">
          <option value="200">200 首（推荐）</option>
          <option value="50">50 首</option>
          <option value="1000">1,000 首</option>
          <option value="0">全部未查询的歌曲</option>
        </select>
      </label>
      <label class="checkbox-row"><input id="includePlaylists" type="checkbox" checked><span>也查找我创建的歌单</span></label>
      <label class="checkbox-row"><input id="retryEmpty" type="checkbox"><span>重新查询之前没有记录的歌曲</span></label>
      <p class="form-hint">为了不给接口添麻烦，每首之间会停顿约 1 秒。进度随时保存，暂停后可以接着同步。</p>
      <p id="collectError" class="error-text" role="alert"></p>
      <button type="submit" class="button primary full-width" id="startCollect">开始同步</button>
    </form>
  </dialog>

  <dialog id="songDialog" aria-labelledby="detailName">
    <button type="button" class="dialog-close icon-button" id="closeSong" aria-label="关闭"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
    <p class="kicker" id="detailKicker">初听档案</p>
    <h2 id="detailName"></h2>
    <p id="detailArtists" class="dialog-copy"></p>
    <dl id="detailFacts"></dl>
    <a class="button ghost" id="songLink" target="_blank" rel="noreferrer">在网易云音乐中打开<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4h6v6M12 4l-7 7"/></svg></a>
  </dialog>

  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
